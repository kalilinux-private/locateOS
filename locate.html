<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>LocateOS</title>
    <style>
      body{
        max-width:1100px;
        width:95;
        margin:60px auto;
        padding:0;
        font-family:sans-serif;
       }
       h1{
        text-align:center;
        }
    </style>
</head>
<body>
    <h1>LocateOS 浏览器定位工具,让你时刻不迷路</h1>
    <div id="langBox" style="text-align:center; margin:20px 0;">
        <button id="langSwitch" style="padding:12px 24px; font-size:24px;">English</button>
    </div>
    <div style="text-align:center; margin:30px 0;">
    <button id="locateBtn" style="padding:12px 26px;font-size:17px;">开始定位</button>
    </div>
        <div id="akBox" style="text-align:center; margin:25px 0;">
        <input id="akInput" placeholder="填入你的百度地图AK" style="padding:10px; width:320px; font-size:16px;">
    </div>
    </div>
    <div id="resultBox" style="margin:25px 0; padding:12px; border:1px solid #aaa; min-height:80px;"></div>
    <div id="mapContainer" style="width:100%;height:500px;border:1px solid #aaa;"></div>
    <script>
    window.baiduAK="{{ak}}"
    </script>
    <script src="/static/locate.js"></script>
</body>
